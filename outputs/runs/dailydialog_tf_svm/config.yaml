run_name: dailydialog_tf_svm
seed: 42
data:
  dataset: dailydialog
  processed_dir: data/processed
model:
  name: tf_svm
  arch: classical
  type: classical
  weighting: tf
  classifier: svm
classical:
  max_iter: 2000
  bm25:
    k1: 1.2
    b: 0.75
  feature_grid:
    ngram_range:
    - - 1
      - 1
    - - 1
      - 2
    min_df:
    - 1
    - 2
  classifier_grid:
    svm:
      C:
      - 0.01
      - 0.03
      - 0.1
      - 0.3
      - 1.0
      class_weight:
      - null
      - balanced
latency:
  batch_size: 1
  max_samples: 300
  warmup: 10
output_dir: outputs/runs/dailydialog_tf_svm
