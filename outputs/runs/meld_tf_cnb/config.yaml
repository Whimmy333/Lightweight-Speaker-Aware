run_name: meld_tf_cnb
seed: 42
data:
  dataset: meld
  processed_dir: data/processed
model:
  name: tf_cnb
  arch: classical
  type: classical
  weighting: tf
  classifier: cnb
classical:
  max_iter: 2000
  bm25:
    k1: 1.2
    b: 0.75
  feature_grid:
    ngram_range:
    - - 1
      - 1
    - - 1
      - 2
    min_df:
    - 1
    - 2
  classifier_grid:
    cnb:
      alpha:
      - 0.03
      - 0.1
      - 0.3
      - 1.0
      - 3.0
latency:
  batch_size: 1
  max_samples: 300
  warmup: 10
output_dir: outputs/runs/meld_tf_cnb
