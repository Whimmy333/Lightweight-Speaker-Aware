run_name: emorynlp_binary_mnb
seed: 42
data:
  dataset: emorynlp
  processed_dir: data/processed
model:
  name: binary_mnb
  arch: classical
  type: classical
  weighting: binary
  classifier: mnb
classical:
  max_iter: 2000
  bm25:
    k1: 1.2
    b: 0.75
  feature_grid:
    ngram_range:
    - - 1
      - 1
    - - 1
      - 2
    min_df:
    - 1
    - 2
  classifier_grid:
    mnb:
      alpha:
      - 0.03
      - 0.1
      - 0.3
      - 1.0
      fit_prior:
      - true
      - false
latency:
  batch_size: 1
  max_samples: 300
  warmup: 10
output_dir: outputs/runs/emorynlp_binary_mnb
